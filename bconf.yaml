tests:
  - id: AC-SSH-001
    title: "Disable root SSH login"
    frameworks:
      CIS: "5.2.8"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "PermitRootLogin no"

  - id: AC-PASSWORD-001
    title: "Ensure password authentication is disabled"
    frameworks:
      CIS: "5.2.10"
      ISO27001: "A.9.4.2"
      NIST: "IA-5"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "PasswordAuthentication no"

  - id: AC-FIREWALL-001
    title: "Check UFW firewall status"
    frameworks:
      CIS: "9.1.1"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "ufw status"
      expected: "active"

  - id: AC-LOGGING-001
    title: "Ensure system logging is enabled"
    frameworks:
      CIS: "1.3.1"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Logging"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/rsyslog.conf"
      expected: "*.info"

  - id: AC-SUDO-001
    title: "Ensure sudo is installed"
    frameworks:
      CIS: "5.1.1"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "which sudo"
      expected: "/usr/bin/sudo"

  - id: AC-AUDITD-001
    title: "Ensure auditd is installed"
    frameworks:
      CIS: "4.1.1"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "high"
    check:
      type: "command"
      command: "systemctl status auditd"
      expected: "active (running)"

  - id: AC-PASSWD-001
    title: "Check password expiration policy"
    frameworks:
      CIS: "5.4.1"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/login.defs"
      expected: "PASS_MAX_DAYS 90"

  - id: AC-FILEPERM-001
    title: "Check /etc/passwd permissions"
    frameworks:
      CIS: "6.1.2"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/passwd"
      expected: "644"

  - id: AC-FILEPERM-002
    title: "Check /etc/shadow permissions"
    frameworks:
      CIS: "6.1.3"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/shadow"
      expected: "640"

  - id: AC-NETWORK-001
    title: "Check SSH port configuration"
    frameworks:
      CIS: "5.2.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-17"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "Port 22"

  - id: AC-FAIL2BAN-001
    title: "Ensure fail2ban is running"
    frameworks:
      CIS: "9.1.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "systemctl status fail2ban"
      expected: "active (running)"

  - id: AC-KERNEL-001
    title: "Check kernel hardening parameters"
    frameworks:
      CIS: "1.5.1"
      ISO27001: "A.12.6.1"
      NIST: "SC-5"
    category: "Kernel"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.tcp_syncookies = 1"

  - id: AC-USERS-001
    title: "Check for empty passwords"
    frameworks:
      CIS: "6.2.3"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "critical"
    check:
      type: "command"
      command: 'sudo awk -F: ''($2 == "") {print}'' /etc/shadow'
      expected: ""

  - id: AC-SSH-002
    title: "Disable SSH X11 forwarding"
    frameworks:
      CIS: "5.2.6"
      ISO27001: "A.9.4.2"
      NIST: "AC-17"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "X11Forwarding no"

  - id: AC-SSH-005
    title: "Disable SSH Host-based authentication"
    frameworks:
      CIS: "5.2.9"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "HostbasedAuthentication no"

  - id: AC-PAM-001
    title: "Check password strength requirements"
    frameworks:
      CIS: "5.3.1"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/pam.d/common-password"
      expected: "pam_cracklib.so"

  - id: AC-KERNEL-002
    title: "Check IP forwarding is disabled"
    frameworks:
      CIS: "3.1.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.ip_forward = 0"

  - id: AC-FIREWALL-002
    title: "Ensure default deny firewall policy"
    frameworks:
      CIS: "9.1.2"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "ufw default"
      expected: "deny"

  - id: AC-FILEPERM-003
    title: "Check /etc/group permissions"
    frameworks:
      CIS: "6.1.4"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/group"
      expected: "644"

  - id: AC-FILEPERM-004
    title: "Check /etc/gshadow permissions"
    frameworks:
      CIS: "6.1.5"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/gshadow"
      expected: "640"

  - id: AC-FILEPERM-010
    title: "Check no duplicate UIDs"
    frameworks:
      CIS: "6.2.2"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "sort -t: -k3 -n /etc/passwd | uniq -c -f2 | wc -l"
      expected: "0"

  - id: AC-SECURITY-002
    title: "Check AppArmor status"
    frameworks:
      CIS: "1.6.2"
      ISO27001: "A.12.6.1"
      NIST: "AC-6"
    category: "Security"
    severity: "high"
    check:
      type: "command"
      command: "apparmor_status | grep 'profiles are enforce'"
      expected: "profiles are enforce"

  - id: AC-PERFORMANCE-002
    title: "Check memory usage"
    frameworks:
      CIS: "1.1.2"
      ISO27001: "A.12.6.1"
      NIST: "SC-5"
    category: "Performance"
    severity: "medium"
    check:
      type: "command"
      command: "free | grep Mem | awk '{print $3/$2 * 100}' | awk '{print int($1)}'"
      expected: "50"
