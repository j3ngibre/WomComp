tests:
  - id: AC-SSH-001
    title: "Disable root SSH login"
    frameworks:
      CIS: "5.2.8"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "PermitRootLogin no"

  - id: AC-PASSWORD-001
    title: "Ensure password authentication is disabled"
    frameworks:
      CIS: "5.2.10"
      ISO27001: "A.9.4.2"
      NIST: "IA-5"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "PasswordAuthentication no"

  - id: AC-FIREWALL-001
    title: "Check UFW firewall status"
    frameworks:
      CIS: "9.1.1"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "ufw status"
      expected: "active"

  - id: AC-LOGGING-001
    title: "Ensure system logging is enabled"
    frameworks:
      CIS: "1.3.1"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Logging"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/rsyslog.conf"
      expected: "*.info"

  - id: AC-SUDO-001
    title: "Ensure sudo is installed"
    frameworks:
      CIS: "5.1.1"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "which sudo"
      expected: "/usr/bin/sudo"

  - id: AC-AUDITD-001
    title: "Ensure auditd is installed"
    frameworks:
      CIS: "4.1.1"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "high"
    check:
      type: "command"
      command: "systemctl status auditd"
      expected: "active (running)"

  - id: AC-PASSWD-001
    title: "Check password expiration policy"
    frameworks:
      CIS: "5.4.1"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/login.defs"
      expected: "PASS_MAX_DAYS 90"

  - id: AC-FILEPERM-001
    title: "Check /etc/passwd permissions"
    frameworks:
      CIS: "6.1.2"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/passwd"
      expected: "644"

  - id: AC-FILEPERM-002
    title: "Check /etc/shadow permissions"
    frameworks:
      CIS: "6.1.3"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/shadow"
      expected: "640"

  - id: AC-NETWORK-001
    title: "Check SSH port configuration"
    frameworks:
      CIS: "5.2.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-17"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "Port 22"

  - id: AC-FAIL2BAN-001
    title: "Ensure fail2ban is running"
    frameworks:
      CIS: "9.1.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "systemctl status fail2ban"
      expected: "active (running)"

  - id: AC-KERNEL-001
    title: "Check kernel hardening parameters"
    frameworks:
      CIS: "1.5.1"
      ISO27001: "A.12.6.1"
      NIST: "SC-5"
    category: "Kernel"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.tcp_syncookies = 1"

  - id: AC-MOUNT-001
    title: "Check /tmp mount options"
    frameworks:
      CIS: "1.1.3"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Filesystem"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/fstab"
      expected: "/tmp nosuid"

  - id: AC-MOUNT-002
    title: "Check /var/tmp mount options"
    frameworks:
      CIS: "1.1.4"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Filesystem"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/fstab"
      expected: "/var/tmp nosuid"

  - id: AC-USERS-001
    title: "Check for empty passwords"
    frameworks:
      CIS: "6.2.3"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "critical"
    check:
      type: "command"
      command: 'sudo awk -F: ''($2 == "") {print}'' /etc/shadow'
      expected: ""

  - id: AC-ROOT-001
    title: "Ensure root login is allowed only via console"
    frameworks:
      CIS: "5.2.8"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/securetty"
      expected: "tty1"

  - id: AC-NTP-001
    title: "Ensure NTP is running"
    frameworks:
      CIS: "2.2.1"
      ISO27001: "A.12.4.4"
      NIST: "AU-8"
    category: "System Time"
    severity: "medium"
    check:
      type: "command"
      command: "systemctl status ntp"
      expected: "active (running)"

  - id: AC-CHRONY-001
    title: "Ensure chrony is running"
    frameworks:
      CIS: "2.2.1"
      ISO27001: "A.12.4.4"
      NIST: "AU-8"
    category: "System Time"
    severity: "medium"
    check:
      type: "command"
      command: "systemctl status chrony"
      expected: "active (running)"

  - id: AC-SSH-002
    title: "Disable SSH X11 forwarding"
    frameworks:
      CIS: "5.2.6"
      ISO27001: "A.9.4.2"
      NIST: "AC-17"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "X11Forwarding no"

  - id: AC-SSH-003
    title: "Set SSH Idle Timeout interval"
    frameworks:
      CIS: "5.2.13"
      ISO27001: "A.9.4.2"
      NIST: "AC-12"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "ClientAliveInterval 300"

  - id: AC-SSH-004
    title: "Set SSH Idle Timeout count"
    frameworks:
      CIS: "5.2.13"
      ISO27001: "A.9.4.2"
      NIST: "AC-12"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "ClientAliveCountMax 0"

  - id: AC-SSH-005
    title: "Disable SSH Host-based authentication"
    frameworks:
      CIS: "5.2.9"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "HostbasedAuthentication no"

  - id: AC-SSH-006
    title: "Disable SSH .rhosts files"
    frameworks:
      CIS: "5.2.12"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "IgnoreRhosts yes"

  - id: AC-SSH-007
    title: "Disable SSH root login via SSH"
    frameworks:
      CIS: "5.2.8"
      ISO27001: "A.9.4.2"
      NIST: "IA-2"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "PermitRootLogin no"

  - id: AC-SSH-008
    title: "Set SSH MaxAuthTries to 4 or less"
    frameworks:
      CIS: "5.2.4"
      ISO27001: "A.9.4.2"
      NIST: "AC-7"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "MaxAuthTries 4"

  - id: AC-SSH-009
    title: "Set SSH MaxSessions to 10 or less"
    frameworks:
      CIS: "5.2.5"
      ISO27001: "A.9.4.2"
      NIST: "AC-10"
    category: "Authentication"
    severity: "low"
    check:
      type: "file_contains"
      file: "/etc/ssh/sshd_config"
      expected: "MaxSessions 10"

  - id: AC-PAM-001
    title: "Check password strength requirements"
    frameworks:
      CIS: "5.3.1"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/pam.d/common-password"
      expected: "pam_cracklib.so"

  - id: AC-PAM-002
    title: "Check password history policy"
    frameworks:
      CIS: "5.3.3"
      ISO27001: "A.9.4.3"
      NIST: "IA-5"
    category: "Authentication"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/pam.d/common-password"
      expected: "remember=5"

  - id: AC-PAM-003
    title: "Check account lockout policy"
    frameworks:
      CIS: "5.3.2"
      ISO27001: "A.9.4.2"
      NIST: "AC-7"
    category: "Authentication"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/pam.d/common-auth"
      expected: "pam_tally2.so"

  - id: AC-KERNEL-002
    title: "Check IP forwarding is disabled"
    frameworks:
      CIS: "3.1.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.ip_forward = 0"

  - id: AC-KERNEL-003
    title: "Check packet forwarding for IPv6 is disabled"
    frameworks:
      CIS: "3.1.2"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv6.conf.all.forwarding = 0"

  - id: AC-KERNEL-004
    title: "Check source packet routing is disabled"
    frameworks:
      CIS: "3.2.1"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.conf.all.send_redirects = 0"

  - id: AC-KERNEL-005
    title: "Check ICMP redirects are disabled"
    frameworks:
      CIS: "3.2.2"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.conf.all.accept_redirects = 0"

  - id: AC-KERNEL-006
    title: "Check secure ICMP redirects are disabled"
    frameworks:
      CIS: "3.2.3"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.conf.all.secure_redirects = 0"

  - id: AC-KERNEL-007
    title: "Check logs of suspicious packets"
    frameworks:
      CIS: "3.3.1"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.conf.all.log_martians = 1"

  - id: AC-KERNEL-008
    title: "Check ignore ICMP broadcasts"
    frameworks:
      CIS: "3.3.2"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "low"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.icmp_echo_ignore_broadcasts = 1"

  - id: AC-KERNEL-009
    title: "Check ignore ICMP bogus errors"
    frameworks:
      CIS: "3.3.3"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "low"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.icmp_ignore_bogus_error_responses = 1"

  - id: AC-KERNEL-010
    title: "Check TCP SYN cookies are enabled"
    frameworks:
      CIS: "3.3.4"
      ISO27001: "A.13.1.1"
      NIST: "SC-5"
    category: "Network"
    severity: "high"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv4.tcp_syncookies = 1"

  - id: AC-KERNEL-011
    title: "Check IPv6 router advertisements"
    frameworks:
      CIS: "3.3.5"
      ISO27001: "A.13.1.1"
      NIST: "AC-4"
    category: "Network"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/sysctl.conf"
      expected: "net.ipv6.conf.all.accept_ra = 0"

  - id: AC-FIREWALL-002
    title: "Ensure default deny firewall policy"
    frameworks:
      CIS: "9.1.2"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "ufw default"
      expected: "deny"

  - id: AC-FIREWALL-003
    title: "Ensure SSH port is allowed on firewall"
    frameworks:
      CIS: "9.1.3"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "high"
    check:
      type: "command"
      command: "ufw status | grep 22"
      expected: "22/tcp"

  - id: AC-FIREWALL-004
    title: "Ensure HTTP port is allowed on firewall"
    frameworks:
      CIS: "9.1.3"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "medium"
    check:
      type: "command"
      command: "ufw status | grep 80"
      expected: "80/tcp"

  - id: AC-FIREWALL-005
    title: "Ensure HTTPS port is allowed on firewall"
    frameworks:
      CIS: "9.1.3"
      ISO27001: "A.13.1.1"
      NIST: "CM-7"
    category: "Network"
    severity: "medium"
    check:
      type: "command"
      command: "ufw status | grep 443"
      expected: "443/tcp"

  - id: AC-FILEPERM-003
    title: "Check /etc/group permissions"
    frameworks:
      CIS: "6.1.4"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/group"
      expected: "644"

  - id: AC-FILEPERM-004
    title: "Check /etc/gshadow permissions"
    frameworks:
      CIS: "6.1.5"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "permission"
      file: "/etc/gshadow"
      expected: "640"

  - id: AC-FILEPERM-005
    title: "Check /etc/passwd ownership"
    frameworks:
      CIS: "6.1.6"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "command"
      command: "stat -c '%U:%G' /etc/passwd"
      expected: "root:root"

  - id: AC-FILEPERM-006
    title: "Check /etc/shadow ownership"
    frameworks:
      CIS: "6.1.7"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "command"
      command: "stat -c '%U:%G' /etc/shadow"
      expected: "root:shadow"

  - id: AC-FILEPERM-007
    title: "Check /etc/group ownership"
    frameworks:
      CIS: "6.1.8"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "command"
      command: "stat -c '%U:%G' /etc/group"
      expected: "root:root"

  - id: AC-FILEPERM-008
    title: "Check /etc/gshadow ownership"
    frameworks:
      CIS: "6.1.9"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "File Integrity"
    severity: "high"
    check:
      type: "command"
      command: "stat -c '%U:%G' /etc/gshadow"
      expected: "root:shadow"

  - id: AC-FILEPERM-009
    title: "Check /etc/passwd no UID 0 non-root accounts"
    frameworks:
      CIS: "6.2.1"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Authentication"
    severity: "critical"
    check:
      type: "command"
      command: "awk -F: '($3 == 0) {print}' /etc/passwd"
      expected: "root:x:0:0:root:/root:/bin/bash"

  - id: AC-FILEPERM-010
    title: "Check no duplicate UIDs"
    frameworks:
      CIS: "6.2.2"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "sort -t: -k3 -n /etc/passwd | uniq -c -f2 | wc -l"
      expected: "0"

  - id: AC-FILEPERM-011
    title: "Check no duplicate GIDs"
    frameworks:
      CIS: "6.2.3"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "sort -t: -k3 -n /etc/group | uniq -c -f2 | wc -l"
      expected: "0"

  - id: AC-FILEPERM-012
    title: "Check no duplicate usernames"
    frameworks:
      CIS: "6.2.4"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "sort -t: -k1 /etc/passwd | uniq -c -f1 | wc -l"
      expected: "0"

  - id: AC-FILEPERM-013
    title: "Check no duplicate group names"
    frameworks:
      CIS: "6.2.5"
      ISO27001: "A.9.4.2"
      NIST: "AC-6"
    category: "Authentication"
    severity: "high"
    check:
      type: "command"
      command: "sort -t: -k1 /etc/group | uniq -c -f1 | wc -l"
      expected: "0"

  - id: AC-AUDIT-002
    title: "Check auditd logging of system calls"
    frameworks:
      CIS: "4.1.2"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/audit/rules.d/audit.rules"
      expected: "-a always,exit -S"

  - id: AC-AUDIT-003
    title: "Check auditd logging of file accesses"
    frameworks:
      CIS: "4.1.3"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/audit/rules.d/audit.rules"
      expected: "-w /etc/passwd -p wa -k identity"

  - id: AC-AUDIT-004
    title: "Check auditd logging of sudoers"
    frameworks:
      CIS: "4.1.4"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/audit/rules.d/audit.rules"
      expected: "-w /etc/sudoers -p wa -k priv_esc"

  - id: AC-AUDIT-005
    title: "Check auditd logging of shadow file"
    frameworks:
      CIS: "4.1.5"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/audit/rules.d/audit.rules"
      expected: "-w /etc/shadow -p wa -k identity"

  - id: AC-AUDIT-006
    title: "Check auditd logging of kernel modules"
    frameworks:
      CIS: "4.1.6"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/audit/rules.d/audit.rules"
      expected: "-w /sbin/insmod -p x -k modules"

  - id: AC-AUDIT-007
    title: "Check auditd logging of firewall changes"
    frameworks:
      CIS: "4.1.7"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Auditing"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/audit/rules.d/audit.rules"
      expected: "-w /etc/ufw/ -p wa -k firewall"

  - id: AC-LOGGING-002
    title: "Check logging of authentication events"
    frameworks:
      CIS: "1.3.2"
      ISO27001: "A.12.4.1"
      NIST: "AU-2"
    category: "Logging"
    severity: "medium"
    check:
      type: "file_contains"
      file: "/etc/rsyslog.conf"
      expected: "auth,authpriv.*"

  - id: AC-LOGGING-003
    title: "Check logging of cron events"
    frameworks:
      CIS: "1.3.3"
      ISO27001: "A.12.4.1"
